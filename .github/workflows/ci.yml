# =====================================================================
#  Pipeline de calidad de CUIDARTE+ (CI/CD)
# =====================================================================
name: Calidad CUIDARTE+

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # ETAPA 1 · Revisiones rápidas (en paralelo)
  # -------------------------------------------------------------------
  secretos:
    name: 1a · Secretos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar Gitleaks
        run: |
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            --retry 3 --retry-delay 5 --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          rm -f gitleaks.tar.gz

      - name: Buscar contraseñas y claves expuestas
        run: ./gitleaks git . --redact -v

  dockerfiles:
    name: 1b · Dockerfiles (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar Dockerfile del backend
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: BACKEND/Dockerfile

      - name: Revisar Dockerfile del frontend
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: FRONTEND/Dockerfile

  # -------------------------------------------------------------------
  # ETAPA 2 · Pruebas unitarias, integración y SonarQube Cloud
  # -------------------------------------------------------------------
  pruebas-codigo:
    name: 2 · Unitarias + Integración (Jest) y SonarQube
    needs: [secretos, dockerfiles]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Encender la base de datos de pruebas
        run: docker compose up -d --wait cuidarteplus-postgres-ev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: BACKEND/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: BACKEND
        run: npm ci --ignore-scripts

      - name: Ejecutar pruebas unitarias e integración con cobertura
        working-directory: BACKEND
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:15442/cuidarteplus
        run: npm test -- --runInBand

      - name: Guardar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: BACKEND/coverage/

      - name: Ajustar rutas de cobertura para SonarQube
        run: sed -i 's#^SF:#SF:BACKEND/#' BACKEND/coverage/lcov.info

      - name: Análisis SonarQube Cloud y Quality Gate
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # v7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

  # -------------------------------------------------------------------
  # ETAPA 3 · Pruebas del sistema completo funcionando
  # -------------------------------------------------------------------
  pruebas-sistema:
    name: 3 · Sistema, aceptación, rendimiento y seguridad
    needs: [pruebas-codigo]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir y encender CUIDARTE+ completo con Docker
        run: docker compose up -d --build --wait

      - name: Esperar a que el frontend responda
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3333 > /dev/null && exit 0
            sleep 2
          done
          echo "El frontend no respondió a tiempo" && exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- Sistema + aceptación + accesibilidad (Playwright + axe-core) ---
      - name: Instalar Playwright
        working-directory: pruebas-e2e
        run: |
          npm ci --ignore-scripts
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Pruebas de sistema, aceptación y accesibilidad
        working-directory: pruebas-e2e
        run: ./node_modules/.bin/playwright test

      - name: Guardar reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: pruebas-e2e/playwright-report/

      # --- Rendimiento (k6) ---
      - name: Prueba de rendimiento (perfil humo)
        run: |
          docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            -v "$PWD/pruebas-k6:/scripts" \
            grafana/k6:1.3.0 run -e PERFIL=humo -e BASE_URL=http://localhost:4444 /scripts/prueba-carga.js

      # --- Seguridad dinámica (OWASP ZAP) ---
      - name: Escaneo de seguridad ZAP (web y API)
        if: always()
        run: |
          mkdir -p zap
          chmod 755 zap
          sudo chown 1000:1000 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3333 -r zap-web.html -I
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:4444/openapi.json -f openapi -r zap-api.html -I
          sudo chown -R "$(id -u):$(id -g)" zap

      - name: Guardar reportes de ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-zap
          path: zap/

      - name: Apagar CUIDARTE+
        if: always()
        run: docker compose down -v

  # -------------------------------------------------------------------
  # ETAPA 4 · Entrega continua: publicar las imágenes aprobadas (GHCR)
  # -------------------------------------------------------------------
  publicar:
    name: 4 · Publicar imágenes Docker (GHCR)
    needs: [pruebas-codigo]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Preparar nombre del dueño en minúsculas
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar imagen del backend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./BACKEND
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/cuidarteplus-backend:latest
            ghcr.io/${{ env.OWNER }}/cuidarteplus-backend:${{ github.sha }}

      - name: Construir y publicar imagen del frontend
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./FRONTEND
          push: true
          build-args: |
            VITE_API_URL=http://localhost:4444
          tags: |
            ghcr.io/${{ env.OWNER }}/cuidarteplus-frontend:latest
            ghcr.io/${{ env.OWNER }}/cuidarteplus-frontend:${{ github.sha }}

