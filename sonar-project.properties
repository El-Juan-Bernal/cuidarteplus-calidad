# Configuración para SonarQube Cloud (usada por el pipeline de GitHub Actions)
sonar.organization=el-juan-bernal
sonar.projectKey=El-Juan-Bernal_cuidarteplus-calidad
sonar.projectName=CUIDARTE+

sonar.sources=BACKEND/src,FRONTEND/src
sonar.tests=BACKEND/tests,pruebas-e2e/tests
sonar.exclusions=**/node_modules/**,FRONTEND/src/assets/**,pruebas-k6/**

# Cobertura de las pruebas del backend
sonar.javascript.lcov.reportPaths=BACKEND/coverage/lcov.info
# El frontend se prueba con Playwright y el E2E no es código de producción del backend
sonar.coverage.exclusions=FRONTEND/src/**,pruebas-e2e/**,**/*.test.js,**/*.spec.js

sonar.sourceEncoding=UTF-8
