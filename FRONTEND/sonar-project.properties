sonar.projectKey=cuidarteplus-frontend
sonar.projectName=CuidartePlus Frontend
sonar.projectVersion=1.0

# Carpeta donde está el código fuente del Frontend
sonar.sources=src

# Archivos a ignorar en el análisis
sonar.exclusions=node_modules/**, dist/**, **/*.test.js, **/*.test.jsx

# URL del servidor local (desde Docker)
sonar.host.url=http://host.docker.internal:9000

